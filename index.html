<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Finep – proposta de facelift</title>
<style>
:root{--bg:#f4f6f7;--card:#ffffff;--ink:#14292a;--muted:#5b6e70;--faint:#7a8b8d;--line:#e1e7e9;--accent:#0c7771;--accent-ink:#065c58;--accent-bg:#e6f2f1;--warn:#b5560f;--warn-bg:#fdf1e6;--bad:#a32d2d;--bad-bg:#fcebeb;--ok:#2f6f2a;--ok-bg:#e8f5ea;--radius:14px}
body.dark{--bg:#0f1719;--card:#162123;--ink:#e6eeef;--muted:#9fb3b5;--faint:#7d9294;--line:#263537;--accent:#5fd0c8;--accent-ink:#9be6e0;--accent-bg:#183334;--warn:#f0a35e;--warn-bg:#352514;--bad:#f09595;--bad-bg:#3a1c1c;--ok:#9ed18d;--ok-bg:#1d2e1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:22px}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,th:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.label{font-size:12px;color:var(--muted)}
.big{font-size:22px;font-weight:600;margin-top:4px;white-space:nowrap}
.sub{font-size:12px;color:var(--faint)}
h2{font-size:16px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hdr h1{font-size:20px;font-weight:600;margin:0}
.hdr p{margin:2px 0 0;color:var(--muted);font-size:13px}
.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpis .card{padding:16px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-call{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.tabs{display:flex;flex-wrap:nowrap;gap:6px;width:100%}
.tab{flex:1 1 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 10px;cursor:pointer;white-space:nowrap;color:var(--muted);font-size:13px;text-align:center}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs-select{display:none;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);white-space:nowrap;text-overflow:ellipsis}
@media (max-width:1119px){.tabs{display:none}.tabs-select{display:block}}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.filters select,.search{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:4px}
.chip{font-size:12px;background:var(--accent-bg);color:var(--accent-ink);border-radius:999px;padding:3px 10px}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.dist{display:flex;flex-direction:column;gap:12px}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.legend div{display:flex;justify-content:space-between;gap:12px}
.legend b{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.reading{display:flex;flex-direction:column;gap:10px}
.reading div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.reading div:last-child{border-bottom:0}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)}
.
